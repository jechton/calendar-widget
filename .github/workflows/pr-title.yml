name: PR title

# Squash merges use the PR title as the commit message, and the release job
# derives the next version from Conventional Commits (see cliff.toml), so the
# title must follow that format. `edited` re-runs the check after a retitle.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
