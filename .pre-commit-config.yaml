repos:
  - repo: local
    hooks:
      - id: ktlint
        name: ktlint check
        entry: ./gradlew ktlintCheck
        language: system
        pass_filenames: false
        files: \.kts?$

      - id: conventional-commit
        name: conventional commit message
        language: system
        stages: [commit-msg]
        entry: >-
          bash -c '
          grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?!?: .+" "$1" ||
          { echo "commit message must follow Conventional Commits, e.g. \"feat: add widget\" or \"fix(sync): handle 401\"" >&2; exit 1; }
          ' --
